<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
  const between = (t,a,b) => clamp((t-a)/(b-a));
  const smooth = x => x*x*(3-2*x);
  const mix = (a,b,u) => a+(b-a)*u;
  // Endpoint ramp, integrated so the pen has no velocity step when entering/exiting a phase.
  function penEase(u) { return .84*u + .16*smooth(u); }
  function velocityRamp(u, initial, final, a=.065, b=.05) {
    const startDeficit=(1-initial)*(u<a?u-u*u/(2*a):a/2);
    const tail=Math.max(0,u-(1-b)), endDeficit=(1-final)*tail*tail/(2*b);
    return clamp((u-startDeficit-endDeficit)/(1-(1-initial)*a/2-(1-final)*b/2));
  }
  // Parameterize time by the distance in the actual displayed geometry, with
  // smooth, curvature-dependent slowing (rather than parameter t of a Bezier).
  function pace(path,sx,sy,turnSensitivity,overlapSensitivity=0) {
    const len=path.getTotalLength(), n=Math.max(2,Math.ceil(len/2)), step=len/n;
    const points=Array.from({length:n+1},(_,i)=>{const p=path.getPointAtLength(i*step);return [p.x*sx,p.y*sy];});
    const look=Math.max(2,Math.round(11/(step*Math.min(sx,sy)))), radius=Math.max(3,Math.round(19/(step*Math.min(sx,sy))));
    const weights=points.map((p,i)=>{
      const a=points[Math.max(0,i-look)],b=points[Math.min(n,i+look)];
      const x=p[0]-a[0],y=p[1]-a[1],u=b[0]-p[0],v=b[1]-p[1];
      const angle=Math.atan2(Math.abs(x*v-y*u),x*u+y*v);
      return 1+turnSensitivity*Math.pow(clamp(angle/1.05),1.35);
    });
    // A pen can move along a line it has already drawn. Spending a whole turn's
    // duration there makes the visible lettering appear to freeze. Detect sustained
    // near-parallel overlaps, not normal intersections, and shorten the invisible retrace.
    if(overlapSensitivity>0){
      const cell=7,history=Math.ceil(26/(step*Math.min(sx,sy))),grid=new Map();
      const tangents=points.map((p,i)=>{const a=points[Math.max(0,i-2)],b=points[Math.min(n,i+2)];const x=b[0]-a[0],y=b[1]-a[1],d=Math.hypot(x,y)||1;return [x/d,y/d];});
      for(let i=0;i<=n;i++){
        const j=i-history;
        if(j>=0){const p=points[j],key=`${Math.floor(p[0]/cell)},${Math.floor(p[1]/cell)}`;if(!grid.has(key))grid.set(key,[]);grid.get(key).push(j);}
        const p=points[i],cx=Math.floor(p[0]/cell),cy=Math.floor(p[1]/cell),t=tangents[i];
        let nearest=5.5;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)for(const k of grid.get(`${cx+dx},${cy+dy}`)||[]){const q=points[k],v=tangents[k];if(Math.abs(t[0]*v[0]+t[1]*v[1])<.86)continue;nearest=Math.min(nearest,Math.hypot(p[0]-q[0],p[1]-q[1]));}
        weights[i]*=1-overlapSensitivity*smooth(clamp(1-nearest/5.5));
      }
    }
    const softened=weights.map((w,i)=>{let sum=0,count=0;for(let j=Math.max(0,i-radius);j<=Math.min(n,i+radius);j++){const k=radius+1-Math.abs(i-j);sum+=k*weights[j];count+=k;}return sum/count;});
    const cumulative=[0];
    for(let i=1;i<=n;i++) cumulative.push(cumulative[i-1]+Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1])*(softened[i]+softened[i-1])/2);
    const total=cumulative[n];
    return u=>{const target=clamp(u)*total;let a=0,b=n;while(a+1<b){const m=(a+b)>>1;if(cumulative[m]<=target)a=m;else b=m;}return (a+clamp((target-cumulative[a])/(cumulative[b]-cumulative[a]||1)))*step;};
  }
  // Reuse a tiny baked grain tile, so the drawing only updates vector masks.
  {
    const tile=document.createElement('canvas');tile.width=tile.height=96;
    const c=tile.getContext('2d'), pixels=c.createImageData(96,96);
    let seed=0x4a71de23;
    const random=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed&0xffff)/65535;};
    for(let i=0;i<96*96;i++){
      const light=random()<.18,y=random(),z=random();
      const alpha=light?Math.max(0,y-.3)*.19:Math.max(0,y-.1)*.23*(.65+z*.35);
      pixels.data[i*4]=pixels.data[i*4+1]=light?255:13;pixels.data[i*4+2]=light?255:21;pixels.data[i*4+3]=Math.round(alpha*255);
    }
    c.putImageData(pixels,0,0);$('grainImage').setAttribute('href',tile.toDataURL('image/png'));
  }
  const rotation = (x,y,a) => [x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
  const xy = p => p.map(x=>x.toFixed(3)).join(' ');
  const logoPhase = Math.PI/12;
  const midpoint=(a,b)=>a.map((x,i)=>(x+b[i])/2);
  const p0=rotation(102,0,logoPhase),p1=rotation(132,27,logoPhase),p2=rotation(89,100,logoPhase),p3=rotation(51,88.3346,logoPhase);
  const q0=midpoint(p0,p1),q1=midpoint(p1,p2),q2=midpoint(p2,p3);
  const r0=midpoint(q0,q1),r1=midpoint(q1,q2),logoStart=midpoint(r0,r1);
  // Begin in the middle of an outer lobe: the arriving arc and the outline share a tangent.
  let logoD = 'M '+xy(logoStart)+' C '+xy(r1)+' '+xy(q2)+' '+xy(p3);
  for(let i=1;i<6;i++) {
    const a=logoPhase+i*Math.PI/3;
    logoD += ' C '+xy(rotation(132,27,a))+' '+xy(rotation(89,100,a))+' '+xy(rotation(51,88.3346,a));
  }
  logoD += ' C '+xy(q0)+' '+xy(r0)+' '+xy(logoStart)+' Z';
  $('logoGeometry').setAttribute('d', logoD);
  $('holePath').setAttribute('d', logoD);
  const textPath=$('letterGeometry'), bridgePath=$('bridgeGeometry'), logoPath=$('logoGeometry');
  const textLen=textPath.getTotalLength(), bridgeLen=bridgePath.getTotalLength(), logoLen=logoPath.getTotalLength();
  const textStrokes=['lettersGlow','lettersBody','lettersGrain'];
  const bridgeStrokes=['bridgeGlow','bridgeBody','bridgeGrain'];
  const logoStrokes=['logoGlow','logoBody','logoGrain'];
  const total=9.4;
  const writeStart=.22, writeEnd=5.72, bridgeEnd=6.74, logoEnd=7.98, portalStart=8.26, portalEnd=9.27;
  const textPace=pace(textPath,.76,.89,.75,.78),bridgePace=pace(bridgePath,1,1,.22),logoPace=pace(logoPath,1,1,.42);
  function stroke(ids, len, from, to) {
    const visible = Math.max(0,to-from);
    ids.forEach(id => {
      const el=$(id);
      el.style.visibility=visible < .05 ? 'hidden' : 'visible';
      el.setAttribute('stroke-dasharray', `${visible} ${len+2}`);
      el.setAttribute('stroke-dashoffset', `${-from}`);
    });
  }
  function opacity(el,v) { el.setAttribute('opacity',clamp(v).toFixed(4)); }
  function setTip(path,distance,transform,op) {
    const p=path.getPointAtLength(clamp(distance,0,path.getTotalLength()));
    const q=transform(p);
    $('movingTip').setAttribute('cx',q.x); $('movingTip').setAttribute('cy',q.y); opacity($('movingTip'),op);
    $('penCore').setAttribute('cx',q.x);$('penCore').setAttribute('cy',q.y);opacity($('penCore'),op*1.6);
  }
  const tmap=p=>({x:82+.76*p.x,y:82+.89*p.y});
  const identity=p=>p;
  function render(t) {
    t=clamp(t,0,total);
    const distance=textPace(velocityRamp(between(t,writeStart,writeEnd),.18,.76));
    const bridgeDist=bridgePace(velocityRamp(between(t,writeEnd,bridgeEnd),.94,.88,.10,.10));
    const logoDist=logoPace(velocityRamp(between(t,bridgeEnd,logoEnd),.92,.12,.07,.11));
    const decay=smooth(between(t,writeEnd-.02,bridgeEnd+.38));
    const portal=between(t,portalStart,portalEnd);
    const zoom=portal===0?1:Math.exp(2.62*(portal*portal*.35+portal*.65));
    const transform=`translate(800 500) scale(${zoom.toFixed(4)})`;
    const lmap=p=>({x:800+zoom*p.x,y:500+zoom*p.y});

    // The lettering is one uninterrupted curve with one shared texture and no joins.
    stroke(textStrokes,textLen,0,distance);
    stroke(['lettersActive'],textLen,Math.max(0,distance-23),distance);
    opacity($('lettersActive'),.11*smooth(between(t,writeStart,writeStart+.15))*(1-smooth(between(t,writeEnd-.13,writeEnd))));
    opacity($('letterGroup'), 1-decay);
    const bridgeTail=bridgeLen*smooth(between(t,writeEnd+.34,bridgeEnd+.34));
    stroke(bridgeStrokes,bridgeLen,Math.min(bridgeDist,bridgeTail),bridgeDist);
    opacity($('bridgeGroup'),1-smooth(between(t,bridgeEnd+.05,bridgeEnd+.36)));
    $('logoGroup').setAttribute('transform',transform);
    stroke(logoStrokes,logoLen,0,logoDist);
    const polished=smooth(between(t,portalStart,portalStart+.27));
    const lineWidth=11/Math.sqrt(zoom);
    $('logoBody').setAttribute('stroke-width',lineWidth);$('logoGrain').setAttribute('stroke-width',Math.max(0,lineWidth-.3/Math.sqrt(zoom)));
    $('logoGlow').setAttribute('stroke-width',lineWidth+3.0/Math.sqrt(zoom));
    opacity($('logoGrain'),1-polished);
    // Add the small terminal glyph only after the continuous outline is nearly closed.
    const mark=smooth(between(t,logoEnd-.27,logoEnd+.15))*(1-smooth(between(t,portalStart,portalStart+.30)));
    opacity($('terminalMark'),mark);
    const markProgress=between(t,logoEnd-.22,logoEnd+.18);
    stroke(['chevronBody'],$('chevronGeometry').getTotalLength(),0,$('chevronGeometry').getTotalLength()*penEase(markProgress));
    stroke(['underscoreBody'],$('underscoreGeometry').getTotalLength(),0,$('underscoreGeometry').getTotalLength()*smooth(between(markProgress,.43,1)));
    $('portalHole').setAttribute('transform',`translate(800 500) scale(${(zoom*.955).toFixed(4)})`);
    opacity($('portalHole'),smooth(between(t,portalStart,portalStart+.20)));
    opacity($('echoRing'),.17*smooth(between(t,portalStart+.07,portalStart+.38))*(1-smooth(between(t,portalStart+.55,portalEnd))));
    opacity($('logoGroup'), 1-smooth(between(t,portalEnd-.14,portalEnd+.02)));
    if(t<writeStart) {opacity($('movingTip'),0);opacity($('penCore'),0);}
    else if(t<writeEnd) {
      const tipAlpha=.27*smooth(between(t,writeStart,writeStart+.12));
      setTip(textPath,distance,tmap,tipAlpha);
    }
    else if(t<bridgeEnd) setTip(bridgePath,bridgeDist,identity,.27);
    else if(t<logoEnd) setTip(logoPath,logoDist,lmap,.27*(1-smooth(between(t,logoEnd-.15,logoEnd))));
    else {opacity($('movingTip'),0);opacity($('penCore'),0);}
    opacity($('animationLayer'),1-smooth(between(t,portalEnd-.05,portalEnd+.07)));
    $('seek').value=t; $('time').textContent=`${t.toFixed(2)} / ${total.toFixed(2)}`;
  }

  let playing=false, position=0, started=0, pending=0;
  function tick(now) {
    if(!playing) return;
    position=clamp((now-started)/1000,0,total);
    render(position);
    if(position>=total) { playing=false; $('play').textContent='播放'; return; }
    pending=requestAnimationFrame(tick);
  }
  function start() { if(position>=total) position=0; playing=true; started=performance.now()-position*1000; $('play').textContent='暂停'; cancelAnimationFrame(pending); pending=requestAnimationFrame(tick); }
  function pause() { playing=false; cancelAnimationFrame(pending); $('play').textContent='播放'; }
  $('play').addEventListener('click',()=>playing?pause():start());
  $('replay').addEventListener('click',()=>{position=0;render(position);start();});
  $('seek').addEventListener('input',e=>{position=Number(e.target.value);render(position);if(playing)started=performance.now()-position*1000;});
  $('fullscreen').addEventListener('click',async()=>{const stage=$('stage'); if(document.fullscreenElement) document.exitFullscreen(); else if(stage.requestFullscreen){try{await stage.requestFullscreen();position=0;render(0);start();}catch{position=0;render(0);start();}}});
  document.addEventListener('keydown',e=>{if(e.code==='Space' && !['BUTTON','INPUT'].includes(document.activeElement?.tagName)){e.preventDefault();playing?pause():start();}});
  const params=new URLSearchParams(location.search);
  if(params.has('clean')) document.body.classList.add('clean');
  if(params.has('t')) {position=clamp(Number(params.get('t'))||0,0,total);render(position);pause();}
  else {render(0);start();}
})();
</script>
</body>
</html>
